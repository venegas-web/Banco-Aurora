<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Aurora</title>
<style>
:root{--navy:#0B1F3A;--navy2:#13305A;--gold:#C9A24B;--gold-l:#EBDDB5;--ivory:#F6F3EC;--ink:#1B2433;--muted:#667085;--line:#E3DFD3;--green:#1F7A57;--red:#A32F2F}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select{font:inherit}
h1,h2,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.01em}
h2{font-size:1.6rem;margin:0 0 4px;color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr;position:relative;overflow:hidden;color:#fff;background:radial-gradient(900px 500px at 8% -10%,#1E4A8A66,transparent),radial-gradient(700px 520px at 100% 110%,#C9A24B40,transparent),linear-gradient(160deg,#050F20,#0B1F3A 55%,#12305C)}
.auth::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-170px;top:-170px;border:1px solid #C9A24B55;box-shadow:0 0 0 60px #C9A24B0f,0 0 0 130px #C9A24B09}
.hero{position:relative;padding:34px 26px 4px}
.hero .logo{font-family:Georgia,serif;font-size:1.9rem;letter-spacing:.45em;color:var(--gold)}
.hero h1{font-size:2rem;line-height:1.12;margin:26px 0 10px;max-width:15ch}
.feat{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px;color:#C9D4E6}
.feat li{padding-left:30px;position:relative}
.feat li::before{content:"";position:absolute;left:0;top:.42em;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px #C9A24B33}
.float{display:none;width:300px;aspect-ratio:1.586;border-radius:18px;background:linear-gradient(135deg,#F0D98A,#C9A24B 45%,#7C5C1E);color:#1a1405;padding:20px;flex-direction:column;justify-content:space-between;box-shadow:0 34px 70px #000a;transform:rotate(-6deg);margin-top:34px}
.panel{position:relative;padding:20px 16px 34px;display:flex;align-items:center;justify-content:center}
.box{width:100%;max-width:430px;background:#fffffff5;color:var(--ink);border-radius:18px;padding:30px 26px;border-top:5px solid var(--gold);box-shadow:0 30px 80px #0009}
.box .foot{margin-top:18px}.chk{display:flex;gap:8px;align-items:center;font-weight:400;margin:10px 0 0}.chk input{width:auto}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px}
.btn{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:6px;background:var(--navy);color:#fff;font-weight:600;cursor:pointer}
.btn.gold{background:linear-gradient(135deg,#E6CB78,#C9A24B 55%,#A8822F);color:var(--navy);box-shadow:0 8px 20px #C9A24B55}.btn:hover{filter:brightness(1.07)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.err{color:var(--red);font-size:.92rem;margin-top:10px;min-height:1.2em}.hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;padding:10px 12px;display:flex;gap:6px;overflow-x:auto;align-items:center;position:sticky;top:0;z-index:5}
.side .logo{font-family:Georgia,serif;color:var(--gold);letter-spacing:.3em;margin-right:8px}
.side button{background:none;border:0;color:#C8D2E2;padding:9px 12px;border-radius:6px;white-space:nowrap;cursor:pointer;text-align:left}
.side button.on{background:var(--navy2);color:#fff;box-shadow:inset 3px 0 var(--gold)}
.side .grow{flex:1}
.main{padding:22px 16px 48px;max-width:980px;width:100%}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px}
.bal{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:12px;padding:24px;margin-top:6px;border-bottom:4px solid var(--gold)}
.bal .n{font-family:Georgia,serif;font-size:2.2rem;color:var(--gold-l)}.bal small{color:#B9C4D6}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.plastic{background:linear-gradient(120deg,#1B1B1B,#3A3A3A);color:#EEE;border-radius:12px;padding:16px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;margin-top:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.row:last-child{border:0}.row small{display:block;color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}
.flash{background:var(--gold-l);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;margin-bottom:12px;color:var(--navy)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{width:auto;margin:0;padding:10px 16px}
.foot{color:var(--muted);font-size:.8rem;margin-top:26px}
@media(min-width:800px){
 .auth{grid-template-columns:1.1fr 1fr}.hero{padding:80px 60px}.hero h1{font-size:3.1rem}.float{display:flex}
 .shell{grid-template-columns:250px 1fr}
 .side{flex-direction:column;align-items:stretch;overflow-y:auto;height:100vh;padding:24px 14px}
 .side .logo{margin:0 0 20px 8px}.main{padding:34px 40px}.grid{grid-template-columns:1.4fr 1fr}
}
@media(prefers-reduced-motion:no-preference){.card,.bal,.box{animation:in .3s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}.float{animation:fl 6s ease-in-out infinite}@keyframes fl{50%{transform:rotate(-6deg) translateY(-12px)}}}
@media print{.side,.acts{display:none}.shell{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<script>
 
/* ===== Lógica ===== */
const KEY='aurora_web_v1',MAX_ATTEMPTS=3,LOCK_MIN=15,QUERY_FEE=20,EXT_FEE=35,FX=17.2;
const CREDIT=['Depósito','Depósito inicial','Cashback','Transferencia recibida'],LIMITED=['Retiro','Transferencia enviada','Pago de servicio','Inversión'];
const money=t=>{const v=Number(String(t).replace(/,/g,'').trim());if(String(t).trim()===''||!isFinite(v))throw new Error('Escribe un número válido.');return v};
const WEAK=['1234','4321','0000','2580','1122','6969','1004','2000','2020'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=n=>n.toLocaleString('es-MX',{style:'currency',currency:'MXN'})+' MXN';
const now=()=>new Date().toLocaleString('es-MX');
const digits=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(x=>x%10).join('')};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 
function pinProblem(p,allowWeak){
  if(!/^\d{4,}$/.test(p))return 'El NIP debe tener al menos 4 dígitos (solo números).';
  if(allowWeak)return null;
  if(WEAK.includes(p))return 'Ese NIP es demasiado común (por ejemplo 1234). Elige otro.';
  for(let k=1;k<=p.length/2;k++)if(p.length%k===0&&p===p.slice(0,k).repeat(p.length/k))return 'No uses NIP repetidos como 0000, 1212 o 123123.';
  const d=[...p].slice(1).map((c,i)=>(+c-+p[i]+10)%10);
  if(d.every(x=>x===1)||d.every(x=>x===9))return 'No uses secuencias como 1234, 4321 o 7890.';
  return null;
}
function luhnOk(n){let t=0;[...n].reverse().forEach((c,i)=>{let d=+c;if(i%2){d*=2;if(d>9)d-=9}t+=d});return t%10===0}
function newCardNumber(){const p='5'+digits(14);for(let d=0;d<10;d++)if(luhnOk(p+d))return p+d}
 
function sha256(msg){ // respaldo para navegadores sin crypto.subtle (p. ej. abrir por http sin localhost)
  const rr=(x,n)=>(x>>>n)|(x<<(32-n)),K=[],H=[];let p=0;
  for(let n=2;p<64;n++){let ok=true;for(let d=2;d*d<=n;d++)if(n%d===0){ok=false;break}
    if(ok){if(p<8)H[p]=(Math.pow(n,.5)%1)*4294967296|0;K[p++]=(Math.pow(n,1/3)%1)*4294967296|0}}
  const b=[...new TextEncoder().encode(msg)],l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const w=new Array(64);
  for(let o=0;o<b.length;o+=64){
    for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,bb,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&bb)^(a&c)^(bb&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
    [a,bb,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function hashPin(pin,salt){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:140000,hash:'SHA-256'},k,256));
  }
  let h=pin+salt;for(let i=0;i<2000;i++)h=sha256(h+pin);return h;
}
//--UI--
function load(){try{const d=JSON.parse(localStorage.getItem(KEY))||{};return{users:d.users||[],tx:d.tx||[],logs:d.logs||[],alerts:d.alerts||[],inv:d.inv||[],sched:d.sched||[]}}catch{return{users:[],tx:[],logs:[],alerts:[],inv:[],sched:[]}}}
let db=load(),storageOk=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{storageOk=false}}
const log=(uid,action,detail)=>{db.logs.push({uid,action,detail,at:now()});save()};
async function createUser(name,username,pin,initial,allowWeak){
  name=name.trim();username=username.trim();
  if(!name||!username)throw new Error('El nombre y el usuario son obligatorios.');
  const pp=pinProblem(pin,allowWeak);if(pp)throw new Error(pp);
  if(!isFinite(initial)||initial<0)throw new Error('El saldo inicial debe ser un número válido, mayor o igual a cero.');
  if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))throw new Error('Ese nombre de usuario ya existe.');
  const salt=digits(16),num=newCardNumber(),d=new Date();
  const u={id:Date.now()+Math.floor(Math.random()*1000),name,username,account:'AU'+digits(10),clabe:'646'+digits(15),salt,pinhash:await hashPin(pin,salt),
    balance:0,fails:0,lockedUntil:0,blocked:false,limit:10000,cur:'MXN',
    card:{kind:'Débito',last4:num.slice(-4),holder:name.toUpperCase(),expiry:String(d.getMonth()+1).padStart(2,'0')+'/'+String((d.getFullYear()+4)%100).padStart(2,'0')}};
  db.users.push(u);
  if(initial>0){u.balance=initial;db.tx.push({uid:u.id,kind:'Depósito inicial',amount:initial,fee:0,detail:'Saldo inicial de demostración',at:now()})}
  save();return u;
}
async function login(id,pin){
  id=id.trim();const u=db.users.find(x=>x.username.toLowerCase()===id.toLowerCase()||x.account===id||x.clabe===id);
  if(!u)throw new Error('Verifica tus datos. La cuenta demo usa usuario demo y NIP 1234.');
  if(u.lockedUntil>Date.now()){log(u.id,'Acceso rechazado','Cuenta con límite de intentos');throw new Error(`Superaste el límite de intentos. Intenta de nuevo en ${Math.ceil((u.lockedUntil-Date.now())/60000)} minuto(s).`)}
  if(await hashPin(pin,u.salt)!==u.pinhash){
    u.fails++;
    if(u.fails>=MAX_ATTEMPTS){u.fails=0;u.lockedUntil=Date.now()+LOCK_MIN*60000;log(u.id,'Acceso limitado',MAX_ATTEMPTS+' intentos fallidos');throw new Error(`Superaste ${MAX_ATTEMPTS} intentos fallidos. La cuenta queda limitada por ${LOCK_MIN} minutos.`)}
    log(u.id,'Acceso rechazado','NIP incorrecto');throw new Error(`Verifica tus datos. Intentos restantes: ${MAX_ATTEMPTS-u.fails}.`);
  }
  if(u.blocked)throw new Error('Esta cuenta está bloqueada.');
  u.fails=0;u.lockedUntil=0;log(u.id,'Inicio de sesión','Acceso web');return u;
}
function addTx(u,kind,amount,detail,fee=0){
  if(!isFinite(amount)||!isFinite(fee)||amount<=0||fee<0)throw new Error('El importe debe ser mayor que cero.');
  const credit=CREDIT.includes(kind);
  if(!credit&&u.balance+1e-8<amount+fee)throw new Error('Saldo insuficiente.');
  const day=new Date().toDateString();
  if(LIMITED.includes(kind)){
    const spent=db.tx.filter(t=>t.uid===u.id&&t.day===day&&LIMITED.includes(t.kind)).reduce((s,t)=>s+t.amount+(t.fee||0),0);
    if(spent+amount+fee>(u.limit||10000))throw new Error('La operación supera tu límite diario.');
  }
  u.balance=Math.round((u.balance+(credit?amount:-amount-fee))*100)/100;
  db.tx.push({uid:u.id,kind,amount,fee,detail,at:now(),day,ts:Date.now()});
  db.alerts.push({uid:u.id,msg:(`${kind} por ${peso(amount)}`+(fee?` (comisión ${peso(fee)})`:'')+` · ${detail}`).slice(0,140),at:now(),seen:false});
  save();
}
function transfer(u,dest,amount,note){
  dest=dest.trim();if(!dest)throw new Error('Escribe el destinatario.');
  const t=db.users.find(x=>x.account===dest||x.clabe===dest);
  if(t&&t.id===u.id)throw new Error('No puedes transferir a tu propia cuenta.');
  if(t&&t.blocked)throw new Error('La cuenta destino no puede recibir transferencias.');
  const fee=t?0:EXT_FEE;
  addTx(u,'Transferencia enviada',amount,`${note} | Destino: ${dest}`,fee);
  if(t)addTx(t,'Transferencia recibida',amount,`${note} | Origen: ${u.account}`);
  return{fee,internal:!!t};
}
function consult(u){addTx(u,'Comisión por consulta',QUERY_FEE,'Consulta de saldo');return u.balance}
//--VIEWS--
const A=document.getElementById('app'),$=s=>document.querySelector(s);let me=null,view='home',flash='';
const field=(id,l,t='text',x='')=>t==='select'?`<label for="${id}">${l}</label><select id="${id}">${x.map(o=>`<option>${o}</option>`).join('')}</select>`:`<label for="${id}">${l}</label><input id="${id}" type="${t}" ${x}>`;
const bal=u=>u.cur==='USD'?`$${(u.balance/FX).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})} USD`:peso(u.balance);
const sign=t=>CREDIT.includes(t.kind)?'<span class="pos">+':'<span class="neg">−';
const unread=()=>db.alerts.filter(a=>a.uid===me.id&&!a.seen).length;
function auth(mode,msg=''){
  stopCam();const reg=mode==='reg';
  A.innerHTML=`<div class="auth"><section class="hero"><div class="logo">AURORA</div><h1>${reg?'Abre tu cuenta en minutos.':'Control claro. Finanzas bajo tu mirada.'}</h1>
  <ul class="feat"><li>Tarjeta de débito ligada a tu cuenta</li><li>Alertas por cada movimiento</li><li>Transferencias, ahorro e inversión simulados</li></ul>
  <div class="float" aria-hidden="true"><span class="serif" style="letter-spacing:.3em">AURORA</span><span style="font-size:1.15rem;letter-spacing:.14em">5120 •••• •••• 0000</span><span>TITULAR · 12/30</span></div></section>
  <section class="panel"><div class="box"><h2>${reg?'Abrir una cuenta':'Bienvenido'}</h2><p class="sub">${reg?'Tu tarjeta de débito quedará ligada a la cuenta.':'Ingresa con tu usuario, número de cuenta o CLABE.'}</p>
  <form id="f" novalidate>${reg?field('n','Nombre completo','text','autocomplete="name"')+field('u','Nombre de usuario','text','autocapitalize="none"')+field('p','NIP de 4 o más dígitos','password','inputmode="numeric" autocomplete="new-password"')+'<div class="hint" id="pm">Evita NIP fáciles como 1234, 0000 o secuencias.</div><label class="chk"><input type="checkbox" id="sp"> Mostrar NIP</label>'+field('i','Saldo inicial de demostración','text','inputmode="decimal" value="0"'):field('id','Usuario, cuenta o CLABE','text','autocapitalize="none" autocomplete="username"')+field('p','NIP','password','inputmode="numeric" autocomplete="current-password"')+'<label class="chk"><input type="checkbox" id="sp"> Mostrar NIP</label>'}
  <div class="err" role="alert">${esc(msg)}</div><button class="btn gold big">${reg?'Crear cuenta':'Entrar a mi cuenta'}</button></form>
  <button class="btn ghost" id="sw" type="button">${reg?'Ya tengo cuenta':'Crear cuenta'}</button>${storageOk?'':'<p class="err">Este navegador no permite guardar datos.</p>'}<p class="foot">Simulador educativo · los datos se guardan solo en este dispositivo.</p></div></section></div>`;
  $('#sw').onclick=()=>auth(reg?'login':'reg');
  $('#sp').onchange=e=>{$('#p').type=e.target.checked?'text':'password'};
  if(reg)$('#p').oninput=()=>{const v=$('#p').value,pr=v?pinProblem(v):null,pm=$('#pm');pm.textContent=v?(pr||'✔ NIP aceptado'):'Evita NIP fáciles como 1234, 0000 o secuencias.';pm.style.color=v?(pr?'var(--red)':'var(--green)'):''};
  $('#f').onsubmit=async e=>{e.preventDefault();const er=$('.err');
    try{if(reg){const u=await createUser($('#n').value,$('#u').value,$('#p').value,money($('#i').value||0));log(u.id,'Cuenta creada','Registro web');auth('login','Cuenta creada. Ya puedes entrar con tu usuario y NIP.')}
        else{me=await login($('#id').value,$('#p').value);view='home';flash='';shell()}}catch(x){er.textContent=x.message;const p=$('#p');if(p)p.value=''}};
}
const NAV=[['home','Resumen'],['transfer','Transferir'],['cash','Depósitos y retiros'],['moves','Movimientos'],['query','Consulta de saldo'],['alerts','Alertas'],['reports','Reportes de gastos'],['savings','Ahorro y presupuesto'],['invest','Cuenta de inversión'],['pay','Pagar servicios'],['joint','Cuentas conjuntas'],['cards','Tarjetas vinculadas'],['sched','Transferencias programadas'],['cashback','Cashback'],['fx','Cambio MXN / USD'],['tickets','Tickets y exportación'],['logs','Historial de accesos'],['voice','Comando de voz'],['vision','Visión artificial'],['chat','Atención al cliente'],['profile','Perfil y seguridad']];
function go(v,f=''){view=v;flash=f;shell()}
function shell(){
  stopCam();me=db.users.find(x=>x.id===me.id);runSched(me);const n=unread();
  A.innerHTML=`<div class="shell"><nav class="side" aria-label="Menú"><div class="logo">AURORA</div>${NAV.map(([k,t])=>`<button data-v="${k}" class="${k===view?'on':''}">${t}${k==='alerts'&&n?` (${n})`:''}</button>`).join('')}<span class="grow"></span><button id="out">Cerrar sesión</button></nav><main class="main" id="m"></main></div>`;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#out').onclick=()=>{log(me.id,'Cierre de sesión','Sesión cerrada');me=null;auth('login')};
  const m=$('#m');m.innerHTML=(flash?`<div class="flash" role="status">${esc(flash)}</div>`:'')+views[view]();flash='';wire[view]&&wire[view](m);
}
const head=(t,s)=>`<h2>${t}</h2><p class="sub">${s}</p>`;
const formHtml=(fs,btn)=>`<div class="card" style="max-width:480px"><form id="f" novalidate>${fs}<div class="err" role="alert"></div><button class="btn gold">${btn}</button></form></div>`;
const onForm=fn=>m=>{m.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await fn()}catch(x){m.querySelector('.err').textContent=x.message}}};
const rowsHtml=l=>l.length?l.map(t=>`<div class="row"><span>${esc(t.kind)}<small>${esc(t.at)} · ${esc(t.detail)}</small></span><span>${sign(t)}${peso(t.amount)}</span></span></div>`).join(''):'<p class="sub">Aún no hay movimientos.</p>';
const mine=()=>db.tx.filter(t=>t.uid===me.id);
const views={
 home:()=>`${unread()?`<div class="flash">Tienes ${unread()} movimiento(s) nuevo(s) en tu cuenta. <a href="#" data-v2="alerts">Ver alertas</a></div>`:''}${head('Hola, '+esc(me.name.split(' ')[0]),'Cuenta '+esc(me.account))}
  <div class="bal"><small>Saldo disponible</small><div class="n">${bal(me)}</div><small>Saldo local de demostración</small></div>
  <div class="acts card"><button class="btn" data-v2="transfer">Transferir</button><button class="btn ghost" data-v2="cash">Depositar o retirar</button><button class="btn ghost" data-v2="pay">Pagar servicio</button></div>
  <div class="grid"><div class="card"><h3 class="serif" style="margin:0 0 6px">Actividad reciente</h3>${rowsHtml(mine().slice(-6).reverse())}</div>

    const d=await M.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite'},runningMode:'VIDEO'});
    return{detect:async v=>d.detectForVideo(v,performance.now()).detections.map(x=>({x:x.boundingBox.originX,y:x.boundingBox.originY,w:x.boundingBox.width,h:x.boundingBox.height}))}}
  catch{detP=null;throw new Error('No se pudo cargar el detector de rostros. Revisa tu conexión a internet o prueba en Chrome.')}})())}
async function openCamera(two){ // cámara 1 = la de la computadora; cámara 2 = celular por DroidCam (aparece como una cámara más)
  const md=navigator.mediaDevices,tmp=await md.getUserMedia({video:true,audio:false});tmp.getTracks().forEach(t=>t.stop()); // da permiso para ver los nombres de las cámaras
  const devs=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput'),droid=d=>/droidcam/i.test(d.label),d=two?devs.find(droid):devs.find(x=>!droid(x));
  if(!d)throw new Error(two?'No se encontró DroidCam. Abre la app DroidCam en el celular y el cliente DroidCam en la computadora, conéctalos y vuelve a intentar.':'No se encontró una cámara en la computadora.');
  return md.getUserMedia({video:{deviceId:{exact:d.deviceId}},audio:false});
}
views.vision=()=>head('Visión artificial','Seguridad: detecta si hay un rostro frente a la cámara. Solo detecta rostros, no identifica personas. El video no se guarda ni se envía a ningún servidor.')+`<div class="card" style="max-width:520px">${me.face?field('src','Cámara','select',['Cámara 1 (computadora)','Cámara 2 (celular · DroidCam)'])+'<p class="hint">La cámara 2 usa DroidCam: abre la app en el celular y el cliente DroidCam en la computadora; aparecerá como una cámara más.</p><canvas id="cv" width="640" height="480" style="width:100%;border-radius:8px;background:#0B1F3A"></canvas><button class="btn gold" id="cam">Iniciar cámara</button><button class="btn ghost" id="camx" hidden>Detener y registrar resultado</button>':'<p class="sub">Activa primero la opción de visión artificial en Perfil y seguridad.</p>'}<div class="err" id="vs" role="alert"></div></div>`;
wire.vision=()=>{if(!me.face)return;const st=$('#vs'),cv=$('#cv'),ctx=cv.getContext('2d');
  $('#cam').onclick=async()=>{try{st.textContent='';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Tu navegador no permite usar la cámara aquí. Abre la página con https.');
    const det=await getDetector();const two=$('#src').value.startsWith('Cámara 2');cam.name=two?'Cámara 2 (celular, DroidCam)':'Cámara 1 (computadora)';cam.stream=await openCamera(two);$('#src').disabled=true;
    const v=cam.video=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=cam.stream;await v.play();cam.found=false;$('#cam').hidden=true;$('#camx').hidden=false;
    const loop=async()=>{if(!cam.stream)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0);let b=[];try{b=await det.detect(v)}catch{st.textContent='El detector no pudo analizar el video.'}
      if(cam.stream){ctx.strokeStyle='#28B478';ctx.lineWidth=4;b.forEach(r=>{ctx.strokeRect(r.x,r.y,r.w,r.h);cam.found=true})}}
      if(cam.stream)cam.raf=requestAnimationFrame(loop)};loop()}
   catch(e){stopCam();$('#src').disabled=false;st.textContent=e.name==='NotAllowedError'?'Permiso de cámara denegado.':e.message}};
  $('#camx').onclick=()=>{const f=cam.found;stopCam();log(me.id,'Visión artificial',(f?'Rostro detectado':'Sin detección')+' · '+cam.name);go('vision',f?'Resultado: se detectó un rostro.':'Resultado: no se detectó un rostro.')}};

  auth('login');
