<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091321">
<title>Banco Aurora · Banca móvil</title>

<style>
:root {
  color-scheme: dark;
  --bg: #091321;
  --panel: #15263be8;
  --line: #ffffff20;
  --text: #f2f0eb;
  --muted: #bbc8d8;
  --gold: #dfc18c;
  --green: #a4dfbd;
  --red: #ffb0a5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: wait; }
a { color: var(--gold); }
h1, h2, h3, p { margin-top: 0; }

h1, h2, .serif {
  font-family: Georgia, serif;
  font-weight: 400;
}

h1 { font-size: 40px; line-height: 1.1; }
h2 { font-size: 30px; margin-bottom: 10px; }
h3 { font-size: 16px; }

button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

#wallpaper {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100dvh;
  z-index: -1;
  pointer-events: none;
}

#app { min-height: 100dvh; }

.brand {
  font-family: Georgia, serif;
  font-size: 23px;
  letter-spacing: .18em;
  color: #f5dfb9;
}

.muted, .hint { color: var(--muted); }
.hint { font-size: 12px; line-height: 1.7; }

.eyebrow {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}

.panel {
  background: var(--panel);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 25px;
  min-width: 0;
  box-shadow: 0 15px 50px #0002;
}

.auth-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 30px 6%;
  gap: 15px;
}

.auth-layout {
  max-width: 1120px;
  margin: auto;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: center;
  padding: 60px 30px 80px;
  min-height: calc(100dvh - 100px);
}

.intro h1 {
  font-size: clamp(55px, 7vw, 95px);
  letter-spacing: -.035em;
  margin-bottom: 22px;
}

.intro .serif { font-size: 29px; max-width: 340px; }
.auth-box { padding: 32px; }
.auth-box h2 { font-size: 27px; }
.auth-box form { margin-top: 20px; }
.auth-switch { text-align: center; margin-top: 20px; font-size: 13px; }

.link {
  border: 0;
  background: none;
  color: var(--gold);
  padding: 4px;
}

.demo {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 20px;
  font-size: 12px;
}

.demo summary { cursor: pointer; }
.demo p { margin: 10px 0 0; }
.local-note { font-size: 11px; color: var(--muted); margin-top: 23px; }

.topbar {
  background: #0b192be6;
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar-inner {
  max-width: 1260px;
  margin: auto;
  padding: 17px 26px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.top-actions { display: flex; align-items: center; gap: 10px; }
.top-actions button { padding: 9px 12px; margin: 0; min-height: 39px; }
.top-name { font-size: 12px; color: var(--muted); }

.nav {
  max-width: 1208px;
  margin: 18px auto 0;
  display: flex;
  gap: 10px;
  padding: 0 26px;
  overflow-x: auto;
}

.nav button {
  background: #17283ddc;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 17px;
  white-space: nowrap;
}

.nav button.active {
  color: #1c2630;
  background: var(--gold);
  border-color: var(--gold);
}

main { max-width: 1208px; margin: auto; padding: 30px 26px 75px; }
.page-title { margin: 4px 0 25px; }
.page-title p { margin: 0; color: var(--muted); font-size: 13px; }

.hero-grid, .lower-grid {
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 22px;
}

.balance {
  background: linear-gradient(125deg, #274057da, #17363cda);
  min-height: 245px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.balance small { color: var(--muted); }

.balance-value {
  font-size: clamp(32px, 4.5vw, 52px);
  letter-spacing: -.04em;
  overflow-wrap: anywhere;
  margin: 10px 0;
}

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { width: auto; margin: 0; flex: 1; }

.plastic {
  background: linear-gradient(110deg, #b99b69, #e4c997 85%);
  border-radius: 14px;
  padding: 22px;
  color: #26312c;
  aspect-ratio: 1.65;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  max-width: 380px;
  width: 100%;
  margin: auto;
  box-shadow: 0 15px 40px #0003;
}

.plastic .brand { color: #26312c; font-size: 19px; }

.chip {
  width: 32px;
  height: 25px;
  border: 1px solid #84774b;
  border-radius: 5px;
  background: linear-gradient(
    90deg,
    transparent 32%,
    #81714e77 34%,
    transparent 36%,
    transparent 65%,
    #81714e77 67%,
    transparent 69%

}

.card-number { letter-spacing: .12em; font-size: 15px; }

.card-bottom {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  font-size: 9px;
  text-transform: uppercase;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
  margin: 20px 0;
}

.stat { padding: 20px; }
.stat small { display: block; color: var(--muted); font-size: 11px; }

.stat strong {
  display: block;
  font-size: 20px;
  font-weight: 500;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 12px;
}

.section-head h3 { margin: 0; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid var(--line);
  padding: 16px 0;
  min-width: 0;
  font-size: 13px;
}

.row:last-child { border: 0; }
.row > div:first-child { min-width: 0; overflow-wrap: anywhere; }

.row small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

.amount { white-space: nowrap; font-size: 12px; }
.positive { color: var(--green); }
.negative { color: var(--red); }

.goal-name {
  font-family: Georgia, serif;
  font-size: 25px;
  margin: 25px 0 9px;
}

.goal-amount { font-size: 19px; color: #f2e0bd; }

progress {
  width: 100%;
  height: 8px;
  accent-color: var(--gold);
  margin: 20px 0 10px;
}

.form-panel { max-width: 650px; margin: 20px auto; }
.form-panel h3 { margin-bottom: 18px; }

label {
  display: block;
  font-size: 12px;
  color: #d4dde6;
  margin: 18px 0 7px;
}

input, select {
  display: block;
  width: 100%;
  min-height: 48px;
  border: 1px solid #becfe42b;
  background: #091827;
  color: var(--text);
  border-radius: 9px;
  padding: 12px 13px;
  outline: 0;
}

input:focus, select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #dfc18c13;
}

input::placeholder { color: #8297a9; }

input[type="checkbox"] {
  display: inline-block;
  width: 17px;
  min-height: 17px;
  height: 17px;
  accent-color: var(--gold);
}

.check {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 400;
  line-height: 1.5;
}

.btn {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 45px;
  padding: 12px 17px;
  margin-top: 20px;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--gold);
  color: #1b2934;
  font-weight: 600;
  font-size: 13px;
}

.btn:hover { filter: brightness(1.08); }

.btn.secondary {
  background: #233b53;
  color: var(--text);
  border-color: var(--line);
}

.btn.danger { background: #5c2d34; color: #ffe1dd; }

.small-button {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #233b53;
  color: var(--text);
  padding: 7px 11px;
  font-size: 12px;
}

.error {
  color: var(--red);
  font-size: 12px;
  white-space: pre-wrap;
  margin-top: 12px;
  min-height: 18px;
}

.notice {
  border: 1px solid #d6b77b55;
  background: #3a362cc9;
  padding: 13px 17px;
  border-radius: 11px;
  font-size: 13px;
  margin-bottom: 22px;
  color: #f3ddb7;
}

.list-panel { margin-top: 20px; }

.empty {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
  padding: 26px 10px;
}

.details-list { font-size: 12px; overflow-wrap: anywhere; }
.details-list .row > span:last-child { text-align: right; max-width: 65%; }

.receipt {
  white-space: pre-wrap;
  font: 13px/1.9 ui-monospace, monospace;
  overflow-wrap: anywhere;
}

.export-actions { margin-top: 18px; }
.export-actions .btn { flex: 1 1 140px; }
.report-bar { height: 5px; background: #dfc18c; border-radius: 4px; margin-top: 7px; }

.camera-box {
  position: relative;
  background: #050e17;
  border-radius: 15px;
  overflow: hidden;
  margin-top: 18px;
}

.camera-box video { display: block; width: 100%; height: auto; }

.camera-box canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.mirror { transform: scaleX(-1); }

#qr {
  background: white;
  border-radius: 12px;
  padding: 16px;
  width: max-content;
  max-width: 100%;
  margin: 20px auto;
  overflow: auto;
}

#chat-log { max-height: 48dvh; overflow: auto; font-size: 13px; line-height: 1.8; }
#chat-log p { padding: 12px; border-radius: 10px; background: #ffffff06; }

.footer {
  font-size: 10px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 20px;
  margin-top: 30px;
}

.wall-control {
  position: fixed;
  bottom: 14px;
  right: 15px;
  z-index: 9;
  padding: 9px 13px;
  background: #101f32df;
  color: #e5d7be;
  border: 1px solid #ffffff29;
  border-radius: 30px;
  font-size: 10px;
  backdrop-filter: blur(15px);
}

dialog {
  width: min(820px, calc(100% - 24px));
  max-height: 85dvh;
  overflow: auto;
  background: #122339;
  color: var(--text);
  border: 1px solid #c7ac7b66;
  border-radius: 20px;
  padding: 25px;
}

dialog::backdrop { background: #020b17c9; backdrop-filter: blur(8px); }

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 18px;
}

.menu-grid button {
  border: 1px solid var(--line);
  background: #1c344e;
  color: var(--text);
  border-radius: 9px;
  padding: 13px;
  text-align: left;
  font-size: 13px;
}

.menu-grid button:hover { border-color: var(--gold); }
[hidden] { display: none !important; }

@media (max-width: 760px) {
  .auth-layout {
    display: block;
    max-width: 480px;
    padding: 12px 20px 75px;
    min-height: auto;
  }

  .intro { text-align: center; margin: 15px 0 28px; }
  .intro h1 { font-size: 61px; margin-bottom: 12px; }
  .intro .serif { font-size: 22px; max-width: none; margin-bottom: 0; }
  .intro > .hint { display: none; }
  .auth-header { padding: 22px; }
  .auth-header > .hint { font-size: 10px; }
  .auth-box { padding: 27px 23px; }
  .topbar-inner { padding: 14px 18px; }
  .topbar .brand { font-size: 18px; }
  .top-name { display: none; }
  .top-actions { gap: 6px; }
  .top-actions button { font-size: 11px; padding: 8px 10px; }
  .nav { margin-top: 14px; padding: 0 18px; gap: 8px; }
  .nav button { font-size: 11px; padding: 9px 13px; }
  main { padding: 25px 18px 75px; }
  .hero-grid, .lower-grid { grid-template-columns: 1fr; gap: 18px; }
  .panel { padding: 22px; border-radius: 17px; }
  .page-title h2 { font-size: 30px; }
  .page-title p { font-size: 12px; }
  .balance { min-height: 245px; }
  .balance-value { font-size: 36px; }
  .actions .btn { font-size: 11px; padding: 10px 12px; }
  .stats { gap: 8px; margin: 18px 0; }
  .stat { padding: 14px 11px; }
  .stat small { font-size: 9px; }
  .stat strong { font-size: 14px; }
  .row { gap: 10px; font-size: 12px; }
  .row .amount { font-size: 11px; }
  .row small { font-size: 9px; }
  .menu-grid { grid-template-columns: 1fr; }
  .plastic { max-width: 350px; }
  .form-panel { padding: 24px 21px; }
}

@media (max-width: 360px) {
  main { padding-left: 12px; padding-right: 12px; }
  .balance-value { font-size: 30px; }
  .stat strong { font-size: 12px; }
  .topbar-inner { padding-left: 12px; padding-right: 12px; }
  .auth-header .brand { font-size: 20px; }
}

@media (prefers-reduced-motion: no-preference) {
  main, .auth-box { animation: appear .25s ease-out; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: none; }
  }
}

@media print {
  body { background: white; color: black; }

  #wallpaper, .wall-control, .topbar, .nav, .page-title,
  .export-actions, .footer, dialog {
    display: none !important;
  }

  .panel { background: white; border: 0; box-shadow: none; padding: 0; }
  .receipt { color: black; font-size: 12px; }
  main { padding: 0; margin: 0; max-width: none; }
}
</style>

<body>
<canvas id="wallpaper" aria-hidden="true"></canvas>
<div id="app"></div>
<button id="wall-toggle" class="wall-control" type="button">Pausar fondo</button>

<script>
'use strict';

const KEY = 'banco_aurora_movil_v1';
const $ = selector => document.querySelector(selector);

const esc = value => String(value ?? '').replace(
  /[&<>"']/g,
  character => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[character])
);

const pesos = value => Number(value).toLocaleString('es-MX', {
  style: 'currency',
  currency: 'MXN'
}) + ' MXN';

const fecha = timestamp => new Date(timestamp).toLocaleString('es-MX');

const today = () => {
  const date = new Date();
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')
  ].join('-');
};

const id = () => crypto.randomUUID();

const digits = length => Array.from(
  crypto.getRandomValues(new Uint32Array(length)),
  value => value % 10
).join('');

const rounded = value => Math.round((value + Number.EPSILON) * 100) / 100;

const expenses = [
  'Retiro',
  'Transferencia enviada',
  'Pago de servicio',
  'Inversión',
  'Ahorro apartado',
  'Comisión por consulta'
];

const limited = [
  'Retiro',
  'Transferencia enviada',
  'Pago de servicio',
  'Inversión'
];

const rates = {
  Conservadora: .05,
  Equilibrada: .09,
  Crecimiento: .13
};

const nav = [
  ['home', 'Resumen'],
  ['transfer', 'Transferencias'],
  ['cash', 'Depósitos y retiros'],
  ['history', 'Movimientos'],
  ['balance', 'Consulta de saldo'],
  ['alerts', 'Alertas'],
  ['reports', 'Reportes de gastos'],
  ['savings', 'Ahorro y presupuesto'],
  ['invest', 'Cuenta de inversión'],
  ['services', 'Pagar servicios'],
  ['joint', 'Cuentas conjuntas'],
  ['cards', 'Tarjetas vinculadas'],
  ['fx', 'Cambio MXN / USD'],
  ['cashback', 'Cashback'],
  ['scheduled', 'Transferencias programadas'],
  ['receipts', 'Tickets y exportación'],
  ['profile', 'Perfil y seguridad'],
  ['logs', 'Historial de accesos'],
  ['camera', 'Cámara y detección'],
  ['voice', 'Comando de voz'],
  ['chat', 'Atención al cliente']
];

let db = {
  users: [],
  tx: [],
  logs: [],
  alerts: [],
  scheduled: [],
  investments: [],
  fx: 17.2
};

let session = null;
let route = 'home';
let authMode = 'login';
let flash = '';
let busy = false;
let audio = null;

const me = () => db.users.find(user => user.id === session);
const mine = () => db.tx.filter(transaction => transaction.uid === session);

function number(value) {
  const raw = String(value).trim();

  if (!/^-?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(raw)) {
    throw Error('Escribe un número válido con un máximo de dos decimales.');
  }

  const result = Number(raw.replace(/,/g, ''));

  if (!Number.isSafeInteger(Math.round(result * 100))) {
    throw Error('El importe es demasiado grande.');
  }

  return result;
}

function validatePin(pin, weak = false) {
  if (!/^\d{4,}$/.test(pin)) {
    throw Error('El NIP debe tener al menos cuatro dígitos.');
  }

  if (weak) return;

  const common = [
    '1234', '4321', '0000', '2580', '1122',
    '6969', '1004', '2000', '2020'
  ];

  if (common.includes(pin)) {
    throw Error('Elige un NIP menos común.');
  }

  for (let length = 1; length <= pin.length / 2; length++) {
    if (
      pin.length % length === 0 &&
      pin === pin.slice(0, length).repeat(pin.length / length)
    ) {
      throw Error('No uses un NIP repetido.');
    }
  }

  const changes = [...pin].slice(1).map(
    (character, index) => (
      Number(character) - Number(pin[index]) + 10
    ) % 10
  );

  if (
    changes.every(change => change === 1) ||
    changes.every(change => change === 9)
  ) {
    throw Error('No uses secuencias como 1234 o 4321.');
  }
}

async function pinHash(pin, salt) {
  if (!crypto.subtle) {
    throw Error('Abre la página mediante HTTPS o localhost para utilizar el inicio de sesión.');
  }

  const encoder = new TextEncoder();

  const key = await crypto.subtle.importKey(
    'raw',
    encoder.encode(pin),
    'PBKDF2',
    false,
    ['deriveBits']
  );

  const result = await crypto.subtle.deriveBits({
    name: 'PBKDF2',
    salt: encoder.encode(salt),
    iterations: 140000,
    hash: 'SHA-256'
  }, key, 256);

  return Array.from(
    new Uint8Array(result),
    value => value.toString(16).padStart(2, '0')
  ).join('');
}

function luhn(number) {
  let sum = 0;

  [...number].reverse().forEach((character, index) => {
    let value = Number(character);

    if (index % 2) {
      value *= 2;
      if (value > 9) value -= 9;
    }

    sum += value;
  });

  return sum % 10 === 0;
}

function cardNumber() {
  const prefix = '5' + digits(14);

  for (let digit = 0; digit < 10; digit++) {
    if (luhn(prefix + digit)) return prefix + digit;
  }
}

function log(uid, action, detail = '') {
  db.logs.push({
    uid,
    action,
    detail,
    ts: Date.now()
  });
}

function mutate(callback) {
  const backup = JSON.stringify(db);

  try {
    const result = callback();
    localStorage.setItem(KEY, JSON.stringify(db));
    return result;
  } catch (error) {
    db = JSON.parse(backup);

    if (
      error.name === 'QuotaExceededError' ||
      error.name === 'SecurityError'
    ) {
      throw Error('No se pudieron guardar los cambios en este navegador.');
    }

    throw error;
  }
}

function post(user, kind, amount, detail, fee = 0, credit = false) {
  if (
    !Number.isFinite(amount) ||
    amount <= 0 ||
    !Number.isFinite(fee) ||
    fee < 0
  ) {
    throw Error('El importe debe ser mayor que cero.');
  }

  if (!credit && rounded(amount + fee) > user.balance) {
    throw Error('Saldo insuficiente.');
  }

  if (limited.includes(kind)) {
    const used = db.tx.filter(transaction =>
      transaction.uid === user.id &&
      transaction.day === today() &&
      limited.includes(transaction.kind)
    ).reduce(
      (total, transaction) => total + transaction.amount + transaction.fee,
      0
    );

    if (rounded(used + amount + fee) > user.limit) {
      throw Error('La operación supera tu límite diario.');
    }
  }

  const next = rounded(
    user.balance + (credit ? amount : -amount - fee)
  );

  if (!Number.isSafeInteger(Math.round(next * 100))) {
    throw Error('El saldo resultante es demasiado grande.');
  }

  user.balance = next;

  const transaction = {
    id: id(),
    uid: user.id,
    kind,
    amount,
    fee,
    detail,
    credit,
    ts: Date.now(),
    day: today(),
    balanceAfter: next
  };

  db.tx.push(transaction);

  if (kind !== 'Depósito inicial') {
    db.alerts.push({
      id: id(),
      uid: user.id,
      message:
        `${kind} por ${pesos(amount)}` +
        (fee ? ' · Comisión ' + pesos(fee) : '') +
        ' · ' + detail,
      ts: transaction.ts,
      seen: false
    });
  }

  return transaction;
}

function send(user, destination, amount, note) {
  destination = destination.trim();

  if (!destination) {
    throw Error('Escribe el destinatario.');
  }

  const target = db.users.find(account =>
    account.account === destination ||
    account.clabe === destination
  );

  if (target?.id === user.id) {
    throw Error('No puedes transferir a tu propia cuenta.');
  }

  if (target?.blocked) {
    throw Error('La cuenta destino está bloqueada.');
  }

  if (
    target &&
    !Number.isSafeInteger(Math.round((target.balance + amount) * 100))
  ) {
    throw Error('La cuenta destino no puede recibir ese importe.');
  }

  const fee = target ? 0 : 35;

  post(
    user,
    'Transferencia enviada',
    amount,
    `${note} · Destino: ${destination}`,
    fee
  );

  if (target) {
    post(
      target,
      'Transferencia recibida',
      amount,
      `${note} · Origen: ${user.account}`,
      0,
      true
    );
  }

  log(user.id, 'Transferencia', destination);
  return fee;
}

async function createUser(name, username, pin, initial, weak = false) {
  name = name.trim();
  username = username.trim();

  if (!name || !username) {
    throw Error('Nombre y usuario son obligatorios.');
  }

  validatePin(pin, weak);

  if (initial < 0) {
    throw Error('El saldo inicial no puede ser negativo.');
  }

  const salt = digits(24);
  const hash = await pinHash(pin, salt);
  const card = cardNumber();
  const date = new Date();

  return mutate(() => {
    if (db.users.some(user =>
      user.username.toLowerCase() === username.toLowerCase()
    )) {
      throw Error('Ese nombre de usuario ya existe.');
    }

    const user = {
      id: id(),
      name,
      username,
      salt,
      hash,
      account: 'AU' + digits(10),
      clabe: '646' + digits(15),
      balance: 0,
      limit: 10000,
      currency: 'MXN',
      sound: true,
      voice: false,
      face: false,
      blocked: false,
      fails: 0,
      lockedUntil: 0,
      saving: {
        name: 'Mi meta',
        target: 5000,
        saved: 0,
        budget: 8000
      },
      joint: [],
      cards: [{
        id: id(),
        kind: 'Débito',
        last4: card.slice(-4),
        holder: name.toUpperCase(),
        expiry:
          String(date.getMonth() + 1).padStart(2, '0') + '/' +
          String((date.getFullYear() + 4) % 100).padStart(2, '0')
      }]
    };

    db.users.push(user);

    if (initial > 0) {
      post(
        user,
        'Depósito inicial',
        initial,
        'Saldo inicial de demostración',
        0,
        true
      );
    }

    log(user.id, 'Cuenta creada', 'Registro web');
    return user;
  });
}

async function login(username, pin) {
  const entered = username.trim();

  const user = db.users.find(account =>
    account.username.toLowerCase() === entered.toLowerCase() ||
    account.account === entered ||
    account.clabe === entered
  );

  if (!user) {
    throw Error('Usuario o NIP incorrectos.');
  }

  if (user.lockedUntil > Date.now()) {
    const minutes = Math.ceil((user.lockedUntil - Date.now()) / 60000);
    throw Error(`Acceso limitado. Intenta de nuevo en ${minutes} minuto(s).`);
  }

  if (await pinHash(pin, user.salt) !== user.hash) {
    mutate(() => {
      user.fails++;

      if (user.fails >= 3) {
        user.fails = 0;
        user.lockedUntil = Date.now() + 15 * 60000;
      }

      log(user.id, 'Acceso rechazado', 'NIP incorrecto');
    });

    throw Error(
      user.lockedUntil > Date.now()
        ? 'Tres intentos fallidos. Acceso limitado durante 15 minutos.'
        : 'NIP incorrecto. Intentos restantes: ' + (3 - user.fails)
    );
  }

  if (user.blocked) {
    throw Error('Esta cuenta está bloqueada.');
  }

  mutate(() => {
    user.fails = 0;
    user.lockedUntil = 0;
    log(user.id, 'Inicio de sesión', 'Acceso web');
  });

  session = user.id;
  route = 'home';
}

function runScheduled() {
  if (!me()) return;

  const ids = db.scheduled.filter(item =>
    item.uid === session &&
    item.status === 'Pendiente' &&
    item.at <= Date.now()
  ).map(item => item.id);

  for (const key of ids) {
    try {
      mutate(() => {
        const item = db.scheduled.find(entry => entry.id === key);

        send(
          me(),
          item.destination,
          item.amount,
          'Programada: ' + item.note
        );

        item.status = 'Ejecutada';
        log(session, 'Transferencia programada', 'Ejecutada');
      });
    } catch (error) {
      mutate(() => {
        const item = db.scheduled.find(entry => entry.id === key);
        item.status = 'No ejecutada: ' + error.message;
        log(session, 'Transferencia programada', item.status);
      });
    }
  }
}

function beep() {
  if (me()?.sound === false) return;

  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;

    audio = audio || new Audio();

    if (audio.state === 'suspended') {
      audio.resume().catch(() => {});
    }

    const oscillator = audio.createOscillator();
    const gain = audio.createGain();

    oscillator.type = 'sine';
    oscillator.frequency.setValueAtTime(880, audio.currentTime);

    gain.gain.setValueAtTime(.025, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audio.currentTime + .035
    );

    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + .04);
  } catch {}
}

function go(key, message = '') {
  if (!views[key]) return;

  stopCamera();

  if (recognizer) {
    recognizer.abort();
    recognizer = null;
  }

  $('#menu-dialog')?.close();

  route = key;
  flash = message;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function download(name, text, type = 'text/plain;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = document.createElement('a');

  link.href = url;
  link.download = name;

  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV() {
  const quote = value => {
    let text = String(value ?? '');

    if (/^[=+@\-]/.test(text)) {
      text = "'" + text;
    }

    return '"' + text.replace(/"/g, '""') + '"';
  };

  const csv =
    '\ufeffFecha,Operación,Importe,Comisión,Detalle,Moneda\r\n' +
    mine().map(transaction => [
      fecha(transaction.ts),
      transaction.kind,
      transaction.amount,
      transaction.fee,
      transaction.detail,
      'MXN'
    ].map(quote).join(',')).join('\r\n');

  mutate(() => log(session, 'Exportación CSV', 'Historial de movimientos'));
  download('historial_aurora.csv', csv, 'text/csv;charset=utf-8');
}

let qrPromise = null;

function loadQR() {
  if (window.QRCode) return Promise.resolve();

  if (!qrPromise) {
    qrPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');

      const timer = setTimeout(() => {
        reject(Error('No se pudo cargar el generador QR. Revisa internet.'));
      }, 15000);

      script.src =
        'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';

      script.onload = () => {
        clearTimeout(timer);
        resolve();
      };

      script.onerror = () => {
        clearTimeout(timer);
        reject(Error('No se pudo cargar el generador QR.'));
      };

      document.head.append(script);
    }).catch(error => {
      qrPromise = null;
      throw error;
    });
  }

  return qrPromise;
}

function showError(error, formElement) {
  const target = formElement?.querySelector('.error');

  if (target) {
    target.textContent = error.message || String(error);
  } else {
    alert(error.message || String(error));
  }
}

async function submit(action, formElement) {
  const value = name => formElement.elements.namedItem(name)?.value ?? '';
  const user = me();

  switch (action) {
    case 'auth': {
      if (authMode === 'register') {
        await createUser(
          value('name'),
          value('username'),
          value('pin'),
          number(value('initial'))
        );

        authMode = 'login';
        renderAuth('Cuenta creada. Ya puedes iniciar sesión.');
      } else {
        await login(value('username'), value('pin'));
        render();
      }

      break;
    }

    case 'cash': {
      const amount = number(value('amount'));
      const kind = value('kind');

      mutate(() => {
        post(
          user,
          kind,
          amount,
          value('detail') || kind,
          0,
          kind === 'Depósito'
        );

        log(session, kind, pesos(amount));
      });

      go('home', kind + ' registrado por ' + pesos(amount) + '.');
      break;
    }

    case 'transfer': {
      const amount = number(value('amount'));
      const destination = value('destination').trim();

      const target = db.users.find(account =>
        account.account === destination ||
        account.clabe === destination
      );

      const fee = target ? 0 : 35;

      if (amount <= 0 || !destination) {
        throw Error('Escribe un destinatario y un importe positivo.');
      }

      if (!confirm(
        `Destino: ${destination}\n` +
        `Importe: ${pesos(amount)}\n` +
        `Comisión: ${pesos(fee)}\n` +
        `Total: ${pesos(amount + fee)}\n\n` +
        '¿Confirmar transferencia simulada?'
      )) return;

      mutate(() => send(user, destination, amount, value('note')));

      go('home', 'Transferencia registrada. Comisión: ' + pesos(fee) + '.');
      break;
    }

    case 'savings': {
      const target = number(value('target'));
      const amount = number(value('amount'));
      const budget = number(value('budget'));

      if (target <= 0 || budget <= 0 || amount < 0) {
        throw Error(
          'Objetivo y presupuesto positivos; aportación mayor o igual a cero.'
        );
      }

      mutate(() => {
        if (amount) {
          post(user, 'Ahorro apartado', amount, 'Aportación a meta');
        }

        Object.assign(user.saving, {
          name: value('name').trim() || 'Mi meta',
          target,
          budget,
          saved: rounded(user.saving.saved + amount)
        });
      });

      go('savings', 'Plan de ahorro guardado.');
      break;
    }

    case 'invest': {
      const amount = number(value('amount'));
      const days = Number(value('days'));
      const product = value('product');

      if (
        !Number.isInteger(days) ||
        days < 1 ||
        days > 3650 ||
        !Object.hasOwn(rates, product)
      ) {
        throw Error('Elige un producto y un plazo entero de 1 a 3650 días.');
      }

      mutate(() => {
        post(user, 'Inversión', amount, `${product}, ${days} días`);

        db.investments.push({
          id: id(),
          uid: session,
          product,
          amount,
          days,
          rate: rates[product],
          ts: Date.now()
        });
      });

      go(
        'invest',
        'Inversión simulada registrada. Rendimiento estimado: ' +
        pesos(amount * rates[product] * days / 365) + '.'
      );

      break;
    }

    case 'services': {
      const amount = number(value('amount'));
      const reference = value('reference').trim();

      if (!reference) {
        throw Error('Escribe la referencia.');
      }

      mutate(() => post(
        user,
        'Pago de servicio',
        amount,
        value('service') + ' · Referencia ' + reference
      ));

      go('home', 'Pago de servicio simulado registrado.');
      break;
    }

    case 'joint': {
      const name = value('name').trim();

      if (!name) {
        throw Error('Escribe el nombre del cotitular.');
      }

      mutate(() => {
        user.joint.push({ name, ts: Date.now() });
        log(session, 'Cotitular registrado', name);
      });

      go('joint', 'Cotitular agregado.');
      break;
    }

    case 'cards': {
      const enteredNumber = value('number').replace(/[\s-]/g, '');
      const holder = value('holder').trim();
      const expiry = value('expiry').trim();
      const match = /^(0[1-9]|1[0-2])\/(\d{2})$/.exec(expiry);
      const date = new Date();

      if (!/^\d{13,19}$/.test(enteredNumber) || !luhn(enteredNumber)) {
        throw Error('Número de tarjeta no válido.');
      }

      if (!holder || !match) {
        throw Error('Escribe el titular y una vigencia MM/AA.');
      }

      const year = 2000 + Number(match[2]);
      const month = Number(match[1]);

      if (
        year < date.getFullYear() ||
        (year === date.getFullYear() && month < date.getMonth() + 1)
      ) {
        throw Error('La tarjeta está vencida.');
      }

      if (user.cards.some(card =>
        card.kind === 'Crédito' &&
        card.last4 === enteredNumber.slice(-4)
      )) {
        throw Error('Esa tarjeta ya está vinculada.');
      }

      mutate(() => {
        user.cards.push({
          id: id(),
          kind: 'Crédito',
          last4: enteredNumber.slice(-4),
          holder: holder.toUpperCase(),
          expiry
        });

        log(
          session,
          'Tarjeta vinculada',
          'Crédito ' + enteredNumber.slice(-4)
        );
      });

      go('cards', 'Tarjeta de prueba vinculada.');
      break;
    }

    case 'fx': {
      const rate = number(value('rate'));
      const amount = number(value('amount'));

      if (rate <= 0 || amount < 0) {
        throw Error('Tipo de cambio positivo y cantidad mayor o igual a cero.');
      }

      mutate(() => {
        db.fx = rate;
      });

      const dollars = value('direction') === 'MXN a USD';
      const converted = dollars ? amount / rate : amount * rate;

      $('#fx-result').textContent = 'Resultado: ' +
        converted.toLocaleString('es-MX', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + (dollars ? ' USD' : ' MXN');

      break;
    }

    case 'cashback': {
      const amount = number(value('amount'));

      if (amount <= 0) {
        throw Error('La compra debe ser mayor que cero.');
      }

      const result = rounded(
        amount * (value('rate') === '1%' ? .01 : .02)
      );

      if (result <= 0) {
        throw Error('Importe muy pequeño para generar cashback.');
      }

      if (!confirm(
        'Cashback: ' + pesos(result) +
        '. ¿Registrarlo en la cuenta de demostración?'
      )) return;

      mutate(() => post(
        user,
        'Cashback',
        result,
        `Cashback ${value('rate')} sobre compra ${pesos(amount)}`,
        0,
        true
      ));

      go('home', 'Cashback registrado: ' + pesos(result));
      break;
    }

    case 'scheduled': {
      const amount = number(value('amount'));
      const at = new Date(value('when')).getTime();
      const destination = value('destination').trim();

      if (
        amount <= 0 ||
        !destination ||
        !Number.isFinite(at) ||
        at <= Date.now()
      ) {
        throw Error('Necesitas fecha futura, destinatario e importe positivo.');
      }

      mutate(() => db.scheduled.push({
        id: id(),
        uid: session,
        destination,
        amount,
        note: value('note'),
        at,
        status: 'Pendiente'
      }));

      go(
        'scheduled',
        'Transferencia programada. No se descuenta hasta su ejecución.'
      );

      break;
    }

    case 'profile': {
      const limit = number(value('limit'));

      if (limit <= 0) {
        throw Error('El límite debe ser positivo.');
      }

      const nextPin = value('newPin');
      let salt = user.salt;
      let hash = user.hash;

      if (nextPin) {
        validatePin(nextPin);

        if (await pinHash(value('oldPin'), user.salt) !== user.hash) {
          throw Error('NIP actual incorrecto.');
        }

        salt = digits(24);
        hash = await pinHash(nextPin, salt);
      }

      mutate(() => {
        Object.assign(user, {
          limit,
          currency: value('currency'),
          sound: formElement.elements.sound.checked,
          voice: formElement.elements.voice.checked,
          face: formElement.elements.face.checked,
          salt,
          hash
        });

        log(session, 'Perfil actualizado', 'Preferencias guardadas');

        if (nextPin) {
          log(session, 'NIP cambiado', 'Cambio de NIP');
        }
      });

      go('profile', 'Perfil guardado.');
      break;
    }

    case 'chat': {
      const question = value('question').trim();
      const normalized = question.toLowerCase();

      if (!question) return;

      let answer;

      if (/comisi/.test(normalized)) {
        answer =
          'Consulta de saldo: $20 MXN. Transferencia externa simulada: ' +
          '$35 MXN. Entre cuentas Aurora: sin comisión.';
      } else if (/saldo/.test(normalized)) {
        if (confirm('La consulta cuesta $20 MXN. ¿Continuar?')) {
          mutate(() => {
            post(
              user,
              'Comisión por consulta',
              20,
              'Consulta desde chatbot'
            );

            log(session, 'Consulta de saldo', 'Comisión de $20 MXN');
          });

          answer =
            'Tu saldo es ' + pesos(me().balance) +
            '. Se cobraron $20 MXN.';
        } else {
          answer = 'Consulta cancelada, sin cobro.';
        }
      } else if (/transfer/.test(normalized)) {
        answer =
          'Abre Transferencias. Usa el número de cuenta o la CLABE ' +
          'del destinatario.';
      } else if (/nip|clave/.test(normalized)) {
        answer =
          'Puedes cambiar el NIP desde Perfil y seguridad. ' +
          'Tres intentos incorrectos limitan el acceso durante 15 minutos.';
      } else if (/ahorro|presupuesto/.test(normalized)) {
        answer =
          'En Ahorro y presupuesto puedes editar tu meta y apartar dinero.';
      } else if (/invers/.test(normalized)) {
        answer =
          'En Cuenta de inversión puedes simular un plazo con tasas ilustrativas.';
      } else if (/tarjeta/.test(normalized)) {
        answer =
          'En Tarjetas vinculadas puedes ver tu débito y vincular ' +
          'tarjetas de crédito de prueba.';
      } else if (/servicio/.test(normalized)) {
        answer = 'En Pagar servicios puedes registrar pagos simulados.';
      } else if (/c[aá]mara|rostro/.test(normalized)) {
        answer =
          'Activa la cámara en Perfil y abre Cámara y detección. ' +
          'En el celular usa la cámara del dispositivo.';
      } else {
        answer =
          'Pregunta por saldo, transferencias, NIP, ahorro, inversión, ' +
          'comisiones, tarjetas o servicios.';
      }

      mutate(() => log(session, 'Chatbot', question.slice(0, 150)));

      const paragraph = document.createElement('p');
      paragraph.textContent = 'Tú: ' + question + '\nAurora: ' + answer;
      paragraph.style.whiteSpace = 'pre-wrap';

      $('#chat-log').append(paragraph);
      $('#chat-log').scrollTop = $('#chat-log').scrollHeight;
      formElement.reset();

      break;
    }

    default:
      throw Error('Operación no disponible.');
  }
}

async function action(name, element) {
  switch (name) {
    case 'auth-switch':
      authMode = authMode === 'login' ? 'register' : 'login';
      renderAuth();
      return;

    case 'menu':
      $('#menu-dialog').showModal();
      $('#menu-search').focus();
      return;

    case 'close-menu':
      $('#menu-dialog').close();
      return;

    case 'logout':
      mutate(() => log(session, 'Cierre de sesión', 'Sesión cerrada'));
      stopCamera();
      if (recognizer) recognizer.abort();
      session = null;
      authMode = 'login';
      renderAuth();
      return;

    case 'consult':
      if (!confirm('Se cobrarán $20 MXN por consultar. ¿Continuar?')) return;

      mutate(() => {
        post(me(), 'Comisión por consulta', 20, 'Consulta de saldo');
        log(session, 'Consulta de saldo', 'Comisión de $20 MXN');
      });

      go('home', 'Saldo después de la comisión: ' + pesos(me().balance));
      return;

    case 'read-alerts':
      mutate(() => db.alerts.forEach(item => {
        if (item.uid === session) item.seen = true;
      }));

      go('alerts', 'Alertas marcadas como leídas.');
      return;

    case 'csv':
      exportCSV();
      return;

    case 'txt':
      download('ticket_aurora.txt', receipt());
      return;

    case 'print':
      window.print();
      return;

    case 'whatsapp':
      window.open(
        'https://wa.me/?text=' + encodeURIComponent(receipt()),
        '_blank',
        'noopener,noreferrer'
      );
      return;

    case 'email':
      location.href =
        'mailto:?subject=' + encodeURIComponent('Ticket Banco Aurora') +
        '&body=' + encodeURIComponent(receipt());
      return;

    case 'qr': {
      await loadQR();

      if (route !== 'receipts') return;

      const box = $('#qr');
      box.hidden = false;
      box.innerHTML = '';

      const transaction = mine().at(-1);

      new QRCode(box, {
        text:
          'BANCO AURORA DEMO\n' +
          'Cuenta: ' + me().account + '\n' +
          'Folio: ' + (transaction?.id || 'Resumen') + '\n' +
          'Importe: ' + pesos(transaction ? transaction.amount : me().balance) + '\n' +
          'Fecha: ' + fecha(transaction?.ts || Date.now()),
        width: 220,
        height: 220
      });

      return;
    }

    case 'unlink': {
      const card = me().cards.find(item =>
        item.id === element.dataset.id &&
        item.kind === 'Crédito'
      );

      if (!card) {
        throw Error('Solo puedes desvincular tarjetas de crédito.');
      }

      if (!confirm(
        '¿Desvincular la tarjeta terminación ' + card.last4 + '?'
      )) return;

      mutate(() => {
        me().cards = me().cards.filter(item => item.id !== card.id);
        log(session, 'Tarjeta desvinculada', card.last4);
      });

      go('cards', 'Tarjeta desvinculada.');
      return;
    }

    case 'block':
      if (!confirm(
        '¿Bloquear esta cuenta y cerrar sesión? No podrás volver a entrar con ella.'
      )) return;

      mutate(() => {
        me().blocked = true;
        log(session, 'Cuenta bloqueada', 'Bloqueo desde perfil');
      });

      stopCamera();
      session = null;
      renderAuth('Cuenta bloqueada.');
      return;

    case 'camera-start':
      await startCamera();
      return;

    case 'camera-stop': {
      const found = camera.found;

      stopCamera();

      mutate(() => log(
        session,
        'Visión artificial',
        found ? 'Rostro detectado' : 'Sin detección'
      ));

      $('#camera-status').textContent = found
        ? 'Se detectó un rostro.'
        : 'No se detectó un rostro.';

      return;
    }

    case 'voice':
      startVoice();
      return;
  }
}

document.addEventListener('submit', async event => {
  const formElement = event.target;

  if (!formElement.matches('form[data-form]')) return;

  event.preventDefault();

  if (busy) return;

  busy = true;

  const button = formElement.querySelector('[type="submit"]');
  button.disabled = true;

  const error = formElement.querySelector('.error');
  if (error) error.textContent = '';

  try {
    await submit(formElement.dataset.form, formElement);
  } catch (error) {
    showError(error, formElement);
  } finally {
    busy = false;
    button.disabled = false;
  }
});

document.addEventListener('click', async event => {
  const button = event.target.closest('button');
  if (!button) return;

  beep();

  if (button.dataset.go) {
    if (busy) return;
    go(button.dataset.go);
    return;
  }

  if (!button.dataset.act || busy) return;

  if (button.dataset.act === 'camera-start') {
    button.disabled = true;

    try {
      await startCamera();
    } catch (error) {
      showError(error);
    } finally {
      button.disabled = false;
    }

    return;
  }

  busy = true;
  button.disabled = true;

  try {
    await action(button.dataset.act, button);
  } catch (error) {
    showError(error);
  } finally {
    busy = false;
    button.disabled = false;
  }
});

document.addEventListener('input', event => {
  if (event.target.matches('input')) beep();

  if (event.target.id === 'menu-search') {
    const normalize = text => text.toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');

    const query = normalize(event.target.value);
    let count = 0;

    document.querySelectorAll('[data-menu-name]').forEach(button => {
      button.hidden = !normalize(button.dataset.menuName).includes(query);
      if (!button.hidden) count++;
    });

    $('#menu-empty').hidden = count > 0;
  }
});

document.addEventListener('change', event => {
  if (event.target.id === 'showPin') {
    $('#pin').type = event.target.checked ? 'text' : 'password';
  }

  if (event.target.id === 'known' && event.target.value) {
    $('#destination').value = event.target.value;
  }

  if (event.target.id === 'mirror') {
    const mirror = event.target.checked;
    $('#camera-video')?.classList.toggle('mirror', mirror);
    $('#camera-boxes')?.classList.toggle('mirror', mirror);
  }
});

let recognizer = null;

function startVoice() {
  if (!me().voice) {
    throw Error('Activa los comandos de voz en Perfil y seguridad.');
  }

  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!Speech) {
    throw Error('Tu navegador no incluye reconocimiento de voz.');
  }

  if (recognizer) recognizer.abort();

  const recognition = recognizer = new Speech();

  recognition.lang = 'es-MX';
  recognition.maxAlternatives = 1;

  $('#voice-status').textContent = 'Escuchando…';

  recognition.onresult = event => {
    const phrase = event.results[0][0].transcript;

    const plain = phrase.toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');

    try {
      mutate(() => log(session, 'Comando de voz', phrase));

      const match = [
        ['movimiento', 'history'],
        ['historial', 'history'],
        ['ahorro', 'savings'],
        ['inversion', 'invest'],
        ['servicio', 'services'],
        ['perfil', 'profile'],
        ['seguridad', 'profile']
      ].find(([word]) => plain.includes(word));

      if (match) {
        go(match[1], 'Comando reconocido: ' + phrase);
      } else if ($('#voice-status')) {
        $('#voice-status').textContent =
          'Escuché: ' + phrase + '. Sin acción asociada.';
      }
    } catch (error) {
      showError(error);
    }
  };

  recognition.onerror = event => {
    if ($('#voice-status')) {
      $('#voice-status').textContent =
        'No se pudo reconocer la voz (' + event.error +
        '). Revisa permisos e internet.';
    }
  };

  recognition.onend = () => {
    if (recognizer === recognition) recognizer = null;
  };

  recognition.start();
}

const camera = {
  stream: null,
  raf: 0,
  epoch: 0,
  found: false
};

let facePromise = null;

function stopCamera() {
  camera.epoch++;

  cancelAnimationFrame(camera.raf);
  camera.raf = 0;

  if (camera.stream) {
    camera.stream.getTracks().forEach(track => track.stop());
  }

  camera.stream = null;

  const video = $('#camera-video');
  if (video) video.srcObject = null;

  const canvas = $('#camera-boxes');

  if (canvas) {
    canvas.getContext('2d').clearRect(
      0, 0, canvas.width, canvas.height
    );
  }
}

async function getDetector() {
  if (!facePromise) {
    facePromise = (async () => {
      if (window.FaceDetector) {
        try {
          const detector = new window.FaceDetector({
            fastMode: true,
            maxDetectedFaces: 3
          });

          return async video => (
            await detector.detect(video)
          ).map(item => ({
            x: item.boundingBox.x,
            y: item.boundingBox.y,
            width: item.boundingBox.width,
            height: item.boundingBox.height
          }));
        } catch {}
      }

      const base =
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';

      const vision = await import(base + '/vision_bundle.mjs');

      const files = await vision.FilesetResolver.forVisionTasks(
        base + '/wasm'
      );

      const detector = await vision.FaceDetector.createFromOptions(files, {
        baseOptions: {
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/' +
            'face_detector/blaze_face_short_range/float16/1/' +
            'blaze_face_short_range.tflite'
        },
        runningMode: 'VIDEO'
      });

      return async video => detector.detectForVideo(
        video,
        performance.now()
      ).detections.map(item => ({
        x: item.boundingBox.originX,
        y: item.boundingBox.originY,
        width: item.boundingBox.width,
        height: item.boundingBox.height
      }));
    })().catch(error => {
      facePromise = null;
      throw error;
    });
  }

  return facePromise;
}

async function startCamera() {
  if (!me()?.face) {
    throw Error('Activa la cámara desde Perfil y seguridad.');
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    throw Error('La cámara requiere HTTPS y un navegador compatible.');
  }

  stopCamera();
  camera.found = false;

  const epoch = camera.epoch;
  const source = $('#camera-source').value;

  $('#camera-status').textContent = 'Solicitando acceso a la cámara…';

  let stream;

  try {
    const videoOptions = source === 'user' || source === 'environment'
      ? { facingMode: { ideal: source } }
      : { deviceId: { exact: source } };

    stream = await navigator.mediaDevices.getUserMedia({
      video: videoOptions,
      audio: false
    });

    if (epoch !== camera.epoch || route !== 'camera') {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    camera.stream = stream;

    const video = $('#camera-video');
    const canvas = $('#camera-boxes');
    const context = canvas.getContext('2d');

    video.srcObject = stream;
    await video.play();

    if (epoch !== camera.epoch || route !== 'camera') return;

    const mirror = $('#mirror').checked;
    video.classList.toggle('mirror', mirror);
    canvas.classList.toggle('mirror', mirror);

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const chooser = $('#camera-source');

      if (chooser && epoch === camera.epoch) {
        devices.filter(device => device.kind === 'videoinput')
          .forEach((device, index) => {
            if (![...chooser.options].some(
              option => option.value === device.deviceId
            )) {
              chooser.add(new Option(
                device.label || 'Cámara ' + (index + 1),
                device.deviceId
              ));
            }
          });
      }
    } catch {}

    if (epoch !== camera.epoch || route !== 'camera') return;

    $('#camera-status').textContent =
      'Cámara abierta. Cargando el detector de rostros…';

    let detect;

    try {
      detect = await getDetector();
    } catch {
      if (epoch === camera.epoch && $('#camera-status')) {
        $('#camera-status').textContent =
          'La cámara funciona, pero no se pudo cargar la detección. ' +
          'Revisa tu conexión a internet.';
      }
      return;
    }

    if (epoch !== camera.epoch || route !== 'camera') return;

    $('#camera-status').textContent =
      'Detector activo. Coloca tu rostro frente a la cámara.';

    let last = 0;
    let lastVideo = -1;

    const loop = async timestamp => {
      if (epoch !== camera.epoch || !camera.stream) return;

      if (
        video.videoWidth &&
        timestamp - last > 160 &&
        video.currentTime !== lastVideo
      ) {
        last = timestamp;
        lastVideo = video.currentTime;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        try {
          const boxes = await detect(video);

          if (epoch !== camera.epoch) return;

          context.clearRect(0, 0, canvas.width, canvas.height);
          context.strokeStyle = '#a8e3bb';
          context.lineWidth = Math.max(3, canvas.width / 250);

          for (const box of boxes) {
            context.strokeRect(box.x, box.y, box.width, box.height);
          }

          if (boxes.length) camera.found = true;

          $('#camera-status').textContent = boxes.length
            ? 'Rostro detectado.'
            : 'Buscando un rostro…';
        } catch {
          if ($('#camera-status')) {
            $('#camera-status').textContent =
              'No se pudo analizar este fotograma.';
          }
        }
      }

      if (epoch === camera.epoch) {
        camera.raf = requestAnimationFrame(loop);
      }
    };

    camera.raf = requestAnimationFrame(loop);
  } catch (error) {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    if (epoch === camera.epoch) {
      stopCamera();

      if ($('#camera-status')) {
        $('#camera-status').textContent =
          error.name === 'NotAllowedError'
            ? 'Permiso de cámara denegado. Actívalo en los permisos de esta página.'
            : error.name === 'NotFoundError'
              ? 'No se encontró una cámara.'
              : 'No se pudo abrir la cámara: ' + error.message;
      }
    }
  }
}

window.addEventListener('pagehide', () => {
  stopCamera();
  if (recognizer) recognizer.abort();
});

window.addEventListener('storage', event => {
  if (event.key !== KEY || !event.newValue) return;

  try {
    const updated = JSON.parse(event.newValue);

    if (Array.isArray(updated.users) && Array.isArray(updated.tx)) {
      db = updated;

      if (session && (!me() || me().blocked)) {
        stopCamera();
        session = null;
        renderAuth('La cuenta se cerró o bloqueó en otra pestaña.');
      }
    }
  } catch {}
});

(async () => {
  try {
    const raw = localStorage.getItem(KEY);

    if (raw) {
      const stored = JSON.parse(raw);

      for (const key of [
        'users', 'tx', 'logs', 'alerts', 'scheduled', 'investments'
      ]) {
        if (!Array.isArray(stored[key])) {
          throw Error('El almacenamiento de Aurora no tiene un formato válido.');
        }
      }

      db = stored;

      if (!(db.fx > 0)) db.fx = 17.2;
    }

    if (!db.users.length) {
      await createUser('Usuario Demo', 'demo', '1234', 25000, true);
    }

    renderAuth();
  } catch (error) {
    $('#app').innerHTML = `
      <main>
        <section class="panel">
          <h2>No se pudo iniciar Aurora</h2>
          <p>${esc(error.message)}</p>
          <p class="hint">
            Comprueba que la página se abra con HTTPS y que el navegador
            permita guardar datos. Si existen datos anteriores,
            consérvalos antes de borrar el almacenamiento.
          </p>
        </section>
      </main>
    `;
  }
})();
</script>

<script>
(() => {
  const canvas = document.getElementById('wallpaper');
  const button = document.getElementById('wall-toggle');
  const context = canvas.getContext('2d', { alpha: false });

  if (!context) {
    button.hidden = true;
    return;
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  let paused = reduced.matches;
  let manual = false;
  let width = 1;
  let height = 1;
  let time = 0;
  let last = 0;
  let animation = 0;

  try {
    manual = localStorage.getItem('aurora_fondo_pausado') === '1';
    paused = paused || manual;
  } catch {}

  const stars = Array.from(
    { length: innerWidth < 650 ? 30 : 65 },
    () => ({
      x: Math.random(),
      y: Math.random(),
      radius: Math.random() + .3,
      phase: Math.random() * 6,
      speed: .4 + Math.random()
    })
  );

  function glow(x, y, radius, color) {
    const gradient = context.createRadialGradient(
      x, y, 0, x, y, radius
    );

    gradient.addColorStop(0, color);
    gradient.addColorStop(1, color.slice(0, 7) + '00');

    context.fillStyle = gradient;
    context.fillRect(0, 0, width, height);
  }

  function wave(x, index) {
    return height * (.43 + index * .10) +
      Math.sin(x / width * 4.2 + time * .2 + index * .8) * height * .17 +
      Math.cos(x / width * 6 - time * .12 + index) * height * .07;
  }

  function draw() {
    const background = context.createLinearGradient(0, 0, width, height);

    background.addColorStop(0, '#080f24');
    background.addColorStop(.6, '#123244');
    background.addColorStop(1, '#091c26');

    context.fillStyle = background;
    context.fillRect(0, 0, width, height);

    glow(
      width * (.16 + Math.sin(time * .07) * .1),
      height * .22,
      Math.max(width, height) * .65,
      '#86569c60'
    );

    glow(
      width * .85,
      height * (.65 + Math.sin(time * .08) * .1),
      Math.max(width, height) * .6,
      '#b893594d'
    );

    context.save();
    context.globalCompositeOperation = 'screen';

    const colors = [
      '#aaa3ec55',
      '#e0c79850',
      '#62c4c34a',
      '#d3b38e42'
    ];

    colors.forEach((color, index) => {
      const gradient = context.createLinearGradient(
        0, 0, width, height
      );

      gradient.addColorStop(0, color.slice(0, 7) + '00');
      gradient.addColorStop(.5, color);
      gradient.addColorStop(1, color.slice(0, 7) + '00');

      context.fillStyle = gradient;
      context.beginPath();

      for (let point = -2; point <= 46; point++) {
        const x = width * point / 44;
        const y = wave(x, index);

        if (point === -2) {
          context.moveTo(x, y);
        } else {
          context.lineTo(x, y);
        }
      }

      for (let point = 46; point >= -2; point--) {
        const x = width * point / 44;

        context.lineTo(
          x,
          wave(x, index) + height * (.1 + index * .015)
        );
      }

      context.closePath();
      context.fill();
    });

    stars.forEach(star => {
      const x = (star.x * width + time * star.speed * 1.2) % width;
      const y = (
        (star.y * height - time * star.speed * 1.7) % height + height
      ) % height;

      const opacity =
        .2 + .3 * (.5 + .5 * Math.sin(time * .5 + star.phase));

      context.fillStyle = `rgba(246,230,201,${opacity})`;
      context.beginPath();
      context.arc(x, y, star.radius, 0, Math.PI * 2);
      context.fill();
    });

    context.restore();
    context.fillStyle = '#040a1420';
    context.fillRect(0, 0, width, height);
  }

  function resize() {
    width = Math.max(1, innerWidth);
    height = Math.max(1, innerHeight);

    const ratio = Math.min(
      devicePixelRatio || 1,
      1.3,
      1600 / width
    );

    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);

    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  function frame(timestamp) {
    if (paused || document.hidden) {
      animation = 0;
      return;
    }

    if (!last) last = timestamp;

    if (timestamp - last > (width < 650 ? 42 : 33)) {
      time += Math.min((timestamp - last) / 1000, .1);
      last = timestamp;
      draw();
    }

    animation = requestAnimationFrame(frame);
  }

  function update() {
    cancelAnimationFrame(animation);

    animation = 0;
    last = 0;

    button.textContent = paused ? 'Activar fondo' : 'Pausar fondo';

    if (!paused && !document.hidden) {
      animation = requestAnimationFrame(frame);
    }
  }

  button.onclick = () => {
    paused = !paused;
    manual = paused;

    try {
      localStorage.setItem('aurora_fondo_pausado', paused ? '1' : '0');
    } catch {}

    update();
  };

  addEventListener('resize', resize, { passive: true });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCamera();
    update();
  });

  reduced.addEventListener('change', () => {
    paused = reduced.matches || manual;
    update();
  });

  addEventListener('pagehide', () => {
    cancelAnimationFrame(animation);
    animation = 0;
  });

  addEventListener('pageshow', update);

  resize();
  update();
})();
</script>
